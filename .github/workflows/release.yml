name: Release

# Publica uma versão a partir de uma tag `vX.Y.Z` (ou manualmente, informando a tag).
# Gera instaladores Linux (deb, rpm, AppImage), Windows (exe NSIS e msi),
# macOS (dmg Apple Silicon e Intel) e Android (apk), anexados a um rascunho
# de release que só é publicado depois que todos os jobs terminam. Se algum
# build falhar, o job `limpar` remove o rascunho e a tag.
#
# Configuração opcional no repositório:
#   vars.VITE_API_BASE_URL         URL da API embutida no frontend
#   secrets.ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                   assinatura do APK; sem elas o APK sai sem assinatura

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão (ex.: v0.2.0), já existente no repositório'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  verificar:
    name: Release / verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Conferir versão da tag
        run: |
          expected="${RELEASE_TAG#v}"
          for file in package.json apps/web/package.json src-tauri/tauri.conf.json; do
            actual=$(node -p "require('./$file').version")
            [ "$actual" = "$expected" ] || { echo "::error file=$file::versão $actual difere da tag $RELEASE_TAG"; exit 1; }
          done
          grep -q "^version = \"$expected\"" src-tauri/Cargo.toml || { echo "::error file=src-tauri/Cargo.toml::versão difere da tag $RELEASE_TAG"; exit 1; }
      - run: npm run check:modules
      - run: npm run test:api
      - run: npm run test:web
      - name: Criar rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "miupy-notes $RELEASE_TAG"

  desktop:
    name: Release / ${{ matrix.name }}
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
          - name: windows
            os: windows-latest
            args: ''
          - name: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Dependências do sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev rpm
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-x64' && 'x86_64-apple-darwin' || matrix.name == 'macos-arm64' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: miupy-notes ${{ env.RELEASE_TAG }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    name: Release / android
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: npm ci
      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Sem segredos de assinatura: o APK sai sem assinatura."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Gerar APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: npm run tauri -- android build --apk
      - name: Anexar APK à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=src-tauri/gen/android/app/build/outputs/apk/universal/release
          apk=$(ls "$dir"/*.apk | head -n 1)
          suffix=$([ -f src-tauri/gen/android/keystore.properties ] && echo "" || echo "-unsigned")
          cp "$apk" "miupy-notes_${RELEASE_TAG#v}_android${suffix}.apk"
          gh release upload "$RELEASE_TAG" miupy-notes_*_android*.apk --clobber

  publicar:
    name: Release / publicar
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  # Trava: se algum build falhar ou for cancelado, nada fica para trás. O rascunho
  # e a tag são removidos; para tentar de novo, recrie a tag no commit corrigido.
  limpar:
    name: Release / limpar
    needs: [verificar, desktop, android]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Remover rascunho e tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$RELEASE_TAG já está publicada; nada foi removido."
            exit 1
          fi
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null ||
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG"
          echo "::error::Builds falharam: rascunho e tag $RELEASE_TAG removidos."
